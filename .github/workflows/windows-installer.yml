name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Pin npm
        run: npm install -g npm@10

      - name: Install frontend dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Test frontend and data adapters
        run: npm run test

      - name: Check imported arena augment metadata
        run: |
          npm run data:arena:augments:check
          npm run data:arena:metabot:check

      - name: Lint frontend
        run: npm run lint

      - name: Build Windows app and NSIS installer
        id: nsis
        shell: pwsh
        run: |
          npm run tauri:build -- --bundles nsis --ci 2>&1 | Tee-Object -FilePath tauri-nsis.log
          if ($LASTEXITCODE -ne 0) {
            "failed" | Out-File tauri-nsis-status.txt
            exit $LASTEXITCODE
          }
          "success" | Out-File tauri-nsis-status.txt

      - name: List Tauri build outputs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path src-tauri/target/release) {
            Get-ChildItem src-tauri/target/release -Recurse |
              Select-Object FullName, Length |
              Format-Table -AutoSize |
              Out-String -Width 4096
          } else {
            Write-Output "src-tauri/target/release does not exist"
          }

      - name: Upload Windows installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LOL-Companion-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload portable Windows exe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LOL-Companion-Windows-Portable
          path: src-tauri/target/release/lol-companion.exe
          if-no-files-found: error

      - name: Upload Tauri Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LOL-Companion-Windows-Diagnostics
          path: |
            tauri-nsis.log
            tauri-nsis-status.txt
          if-no-files-found: warn
