name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Verify and build Windows x64
    runs-on: windows-2025
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject console-based League discovery
        shell: bash
        run: |
          if rg 'Command::new\("(wmic|reg)' src-tauri/src/lcu; then
            echo "League discovery must use native Windows APIs."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10

      - name: Setup Rust x64 MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate bundled data
        run: |
          npm run data:arena:check
          npm run data:game:check

      - name: Test and lint frontend
        run: |
          npm run test
          npm run lint

      - name: Build frontend
        run: npm run build

      - name: Check and test Rust
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
          cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build portable executable
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Smoke-start portable executable by PID
        shell: pwsh
        run: |
          $exe = Resolve-Path "src-tauri/target/x86_64-pc-windows-msvc/release/lol-companion.exe"
          $logRoot = Join-Path $env:LOCALAPPDATA "LOL Companion\logs"
          $startedAt = Get-Date
          $process = $null
          $ready = $false
          try {
            $process = Start-Process -FilePath $exe -PassThru
            $deadline = (Get-Date).AddSeconds(20)
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              if ($process.HasExited) {
                break
              }
              $process.Refresh()
              if ($process.MainWindowHandle -ne [IntPtr]::Zero) {
                $ready = $true
                break
              }
              if (Test-Path $logRoot) {
                $readyLog = Get-ChildItem $logRoot -Filter "lol-companion.*.log" -File |
                  Where-Object { $_.LastWriteTime -ge $startedAt } |
                  Select-String -Pattern "desktop diagnostics initialized" -Quiet
                if ($readyLog) {
                  $ready = $true
                  break
                }
              }
            }
            if (-not $ready) {
              if (Test-Path $logRoot) {
                Get-ChildItem $logRoot -Filter "lol-companion.*.log" -File |
                  ForEach-Object { Get-Content $_.FullName }
              }
              throw "Portable executable did not expose a window or ready log marker within 20 seconds."
            }
          }
          finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
            }
          }

      - name: Build NSIS installer
        shell: pwsh
        run: |
          npm run tauri:build -- --bundles nsis --target x86_64-pc-windows-msvc --ci 2>&1 |
            Tee-Object -FilePath tauri-nsis.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            throw "Tauri NSIS build failed with exit code $buildExit."
          }

      - name: Assert and stage release artifacts
        shell: pwsh
        run: |
          $portable = Get-Item "src-tauri/target/x86_64-pc-windows-msvc/release/lol-companion.exe"
          if ($portable.Length -le 0) {
            throw "Portable executable is empty."
          }
          $installers = @(Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*-setup.exe" -File)
          if ($installers.Count -lt 1) {
            throw "No NSIS setup executable was produced."
          }

          New-Item -ItemType Directory -Force "artifacts/portable", "artifacts/installer" | Out-Null
          Copy-Item $portable.FullName "artifacts/portable/LOL-Companion-Portable.exe"
          $installers | ForEach-Object { Copy-Item $_.FullName "artifacts/installer/$($_.Name)" }

          $files = @(
            Get-Item "artifacts/portable/LOL-Companion-Portable.exe"
            Get-ChildItem "artifacts/installer" -Filter "*.exe" -File
          )
          $checksums = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content "artifacts/SHA256SUMS.txt"
          Get-Content "artifacts/SHA256SUMS.txt"

      - name: Upload verified NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: LOL-Companion-Windows-Installer
          path: |
            artifacts/installer/*.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload verified portable executable
        uses: actions/upload-artifact@v4
        with:
          name: LOL-Companion-Windows-Portable
          path: |
            artifacts/portable/LOL-Companion-Portable.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Collect failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "artifacts/diagnostics" | Out-Null
          if (Test-Path "tauri-nsis.log") {
            Copy-Item "tauri-nsis.log" "artifacts/diagnostics/tauri-nsis.log"
          }
          $logRoot = Join-Path $env:LOCALAPPDATA "LOL Companion\logs"
          if (Test-Path $logRoot) {
            Copy-Item "$logRoot\*.log" "artifacts/diagnostics" -ErrorAction SilentlyContinue
          }
          if (Test-Path "src-tauri/target/x86_64-pc-windows-msvc/release") {
            Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release" -Recurse |
              Select-Object FullName, Length, LastWriteTime |
              Format-Table -AutoSize |
              Out-String -Width 4096 |
              Set-Content "artifacts/diagnostics/build-tree.txt"
          }

      - name: Upload build failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LOL-Companion-Windows-Diagnostics
          path: artifacts/diagnostics
          if-no-files-found: warn
