name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Pin npm
        run: npm install -g npm@10

      - name: Install frontend dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Test frontend and data adapters
        continue-on-error: true
        run: npm run test

      - name: Check imported arena augment metadata
        run: |
          npm run data:arena:augments:check
          npm run data:arena:metabot:check

      - name: Lint frontend
        run: npm run lint

      - name: Build portable Windows app
        run: |
          npm run build
          cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS installer
        id: nsis
        continue-on-error: true
        run: npm run tauri:build -- --bundles nsis --ci

      - name: List Tauri build outputs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path src-tauri/target/release) {
            Get-ChildItem src-tauri/target/release -Recurse |
              Select-Object FullName, Length |
              Format-Table -AutoSize |
              Out-String -Width 4096
          } else {
            Write-Output "src-tauri/target/release does not exist"
          }

      - name: Upload Windows installers
        if: steps.nsis.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: LOL-Companion-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload portable Windows exe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LOL-Companion-Windows-Portable
          path: src-tauri/target/release/lol-companion.exe
          if-no-files-found: error

      - name: Fail if NSIS installer failed
        if: steps.nsis.outcome != 'success'
        run: exit 1
