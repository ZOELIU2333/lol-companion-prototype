name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Pin npm
        run: npm install -g npm@10

      - name: Install frontend dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Test frontend and data adapters
        continue-on-error: true
        run: npm run test

      - name: Check imported arena augment metadata
        run: |
          npm run data:arena:augments:check
          npm run data:arena:metabot:check

      - name: Lint frontend
        run: npm run lint

      - name: Build Tauri app and installers
        run: npm run tauri:build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: LOL-Companion-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload portable Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: LOL-Companion-Windows-Portable
          path: src-tauri/target/release/lol-companion.exe
          if-no-files-found: error
